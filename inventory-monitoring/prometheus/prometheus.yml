global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  # Node Exporter must be running on the monitored EC2 host or reachable
  # through an SSH tunnel bound to the Docker host on port 9100.
  - job_name: ec2-node-exporter
    static_configs:
      - targets: ["host.docker.internal:9100"]
